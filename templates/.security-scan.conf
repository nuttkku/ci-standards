# ค่าของ scripts/security-scan.sh (nuttkku/ci-standards v2) — เหตุผลของทุกข้อยกเว้นเขียนไว้ใน CI-CD.md
# IMAGES: "ชื่อ|build context|target (เว้นได้)|trivy skip-dirs|trivy skip-files|ignorefile"
IMAGES=(
  "app|.||/usr/local/lib/node_modules/npm"  # npm CLI ใช้ตอนติดตั้งเท่านั้น ไม่ถูกเรียกตอนแอปรัน
)
SAST=semgrep                # semgrep | snyk (ต้อง `snyk auth` หรือ SNYK_TOKEN)
# SAST_FAIL=0               # รายงานอย่างเดียว — ใช้เมื่อ finding ที่เหลือตรวจแล้วว่าเป็น false positive ทั้งหมด
# ZAP_TARGET=http://localhost:8080   # สแต็กที่เปิดในเครื่อง (docker compose up -d) — ห้ามชี้ production โดยไม่ได้รับอนุญาต
# ZAP_RULES=.zap/rules.tsv
